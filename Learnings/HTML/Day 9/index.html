<body>

    <h1><b>Job Application With Resume Upload</b></h1>

    <br><br>

    <br><br>

    <label for="phone">Contact</label>

    <br><br>

    <br><br>

            <option value="Mtech">M Tech</option>
            <option value="MBBS">MBBS</option>
            <option value="Phd">Phd</option>
            <option value="bcom">B com</option>
            <option value="mcom">M Com</option>
            <option value="Bsc">Bsc</option>
        </select>
    </legend>
    </fieldset>

    <br><br>

    <fieldset>
        <legend>
      
            <h4>skills</h4>

            <label for="skills">C</label>
            <input type="radio" name="skills" id="skills"><br>
            <label for="skills">C++</label>
            <input type="radio" name="skills" id="skills"><br>
            <label for="skills">python</label>
            <input type="radio" name="skills" id="skills"><br>
            <label for="skills">Java Script</label>
            <input type="radio" name="skills" id="skills"><br>
            
        </legend>
    </fieldset>


    <br><br>

        <h4>Which Type Of Job Do you Want?</h4>

            <label for="job">Part Time</label>
            <input type="radio" name="job" id="job"><br>
            <label for="jpb">Full Time</label>
            <input type="radio" name="job" id="job"><br>
            <label for="job">Parmaent</label>
            <input type="radio" name="job" id="job"><br>
            <label for="job">Internship</label>
            <input type="radio" name="job" id="job"><br>

    <lable for="comments">Comments</lable>
    <input type="text" id="comments" name="comments" weidth="200">
