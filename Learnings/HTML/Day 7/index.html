<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Audio Example</title>
</head>
<body>



    <h2>Video 1</h2>

    <video controls autoplay muted width="438" height="656">
        <source src="https://www.pexels.com/video/the-business-of-flower-culturing-2896138/" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <br><br>

    <h2>Video 2</h2>

    <video controls width="438" height="656">
        <source src="business.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <br><br>

    <h2>Audio</h2>

    <audio controls>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

</body>
</html>
